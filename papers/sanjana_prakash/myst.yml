version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2026-<folder>` the folder should be `<firstname_surname>`
  id: scipy-2026-sanjana_prakash
  # Ensure your title is the same as in your `main.md`
  title:
    A Python Framework for Molecular Dynamics-Informed Machine Learning in
    Enzyme Engineering
  # subtitle:
  description: >
    framework for integrating molecular dynamics simulation-derived structural
    and dynamical features into machine learning workflows for enzyme
    engineering and protein design.
  # Authors should have affiliations, emails and ORCIDs if available
  authors:
    - name: Sai Sanjana Prakash
      email: prakash.saisanjana@gmail.com
      orcid: 0009-0008-9760-6477
    - name: Justin Seyedmoomenkashi
      email: Justin.Seyedmoomenkashi@mail.mcgill.ca
      orcid: 0009-0005-7280-3632
      affiliations:
        - McGill University
    - name: Charlie Hou
      email: yh4298@nyu.edu
      orcid: 0009-0008-0719-940X
      affiliations:
        - New York University
  keywords:
    - PETase
    - Enzyme Engineering
    - De Novo Design
    - molecular dynamics
    - machine learning
    - protein engineering
    - computational biology
    - structural bioinformatics
  # Add the abbreviations that you use in your paper here
  abbreviations:
    MyST: Markedly Structured Text
  # It is possible to explicitly ignore the `doi-exists` check for certain citation keys
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
