version: 1
extends: ../papers.yml
project:
  id: scipy-2026-dagster_slurm
  title: 'dagster-slurm: Dagster Assets on Slurm-Managed Scientific Workflows'
  description:
    An open-source integration that runs Dagster asset source code across local,
    CI, and Slurm-managed execution targets, demonstrated on a web-scale
    European firm-discovery pipeline.
  banner: asset_graph_tiers.png
  thumbnail: asset_graph_tiers.png
  authors:
    - name: Hernan Picatto
      email: h.picatto@gmail.com
      orcid: 0000-0001-6662-464X
      corresponding: true
      affiliations:
        - Austrian Supply Chain Intelligence Institute (ASCII)
    - name: Maximilian Hess
      orcid: 0009-0007-8093-7117
      affiliations:
        - Austrian Supply Chain Intelligence Institute (ASCII)
    - name: Georg Heiler
      orcid: 0000-0002-8684-1163
      affiliations:
        - Complexity Science Hub Vienna (CSH)
        - Austrian Supply Chain Intelligence Institute (ASCII)
    - name: Martin Pfister
      affiliations:
        - AI Factory Austria
  keywords:
    - Dagster
    - Slurm
    - HPC
    - reproducible research
    - workflow orchestration
    - Pixi
  abbreviations:
    HPC: High-Performance Computing
    RSE: Research Software Engineering
    CI: Continuous Integration
    LoRA: Low-Rank Adaptation
    CC: Common Crawl
    CPU: Central Processing Unit
    GPU: Graphics Processing Unit
    SSH: Secure Shell
    QoS: Quality of Service
    JSON: JavaScript Object Notation
    URL: Uniform Resource Locator
    RAM: Random Access Memory
    S3: Simple Storage Service
    API: Application Programming Interface
    MFA: Multi-Factor Authentication
    VSC: Vienna Scientific Cluster
  # SciPy proceedings DOIs (10.25080/...) are not registered with Crossref until publication,
  # so the doi-exists check is ignored for those keys.
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - dagster
        - docker
        - pixi
        - dagsterpipes
        - cwl_wiki
        - commoncrawl
        - daskjobqueue
        - nuextract
        - resiliparse
        - feickert2025pixi
        - turner2024flyte
        - staneva2024echodataflow
        - bednar2023pandata
        - moritz2018ray
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
