version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2026-<folder>` the folder should be `<firstname_surname>`
  id: scipy-2026-575-lab
  # Ensure your title is the same as in your `main.md`
  title:
    'Opening the Black Box: Mechanistic Interpretability for AI Agent Tool
    Selection Using Sparse Autoencoders'
  subtitle:
    A complete pipeline for interpreting agent tool-selection decisions with
    JumpReLU sparse autoencoders
  # subtitle:
  description:
    A mechanistic interpretability pipeline that explains why AI agents choose
    particular tools, using sparse autoencoder features extracted at the
    decision token. Feature explanations are validated with token-level fuzzing
    across agent scenarios in five domains.
  # Authors should have affiliations, emails and ORCIDs if available
  authors:
    - name: Hannes Hapke
      orcid: 0009-0005-3111-7353
      email: hannes.hapke@dataiku.com
      corresponding: true
      roles:
        - Conceptualization
        - Software
        - Writing - original draft
        - Project administration
      affiliations:
        - id: dataiku-pdx
          institution: 575 Lab, Dataiku Inc.
          city: Portland
          region: Oregon
          country: USA
    - name: David Cardozo
      orcid: 0009-0006-1234-9973
      email: david.cardozo@dataiku.com
      roles:
        - Software
        - Methodology
        - Validation
      affiliations:
        - id: dataiku-yyz
          institution: 575 Lab, Dataiku Inc.
          city: Toronto
          region: Ontario
          country: Canada
    - name: Carlos Huisa
      orcid: 0009-0003-3599-3209
      email: carlos.huisa@dataiku.com
      roles:
        - Formal analysis # the causal/CATE ablation work
        - Investigation
      affiliations:
        - id: dataiku-tx
          institution: Dataiku Inc.
          city: Austin
          region: Texas
          country: USA
    - name: Triveni Gandhi
      orcid: 0000-0001-6964-8460
      email: triveni.gandhi@dataiku.com
      roles:
        - Conceptualization # the RAFT responsible-AI framing
      affiliations:
        - id: dataiku-ny
          institution: Dataiku Inc.
          city: New York City
          region: New York
          country: USA
  keywords:
    - mechanistic interpretability
    - sparse autoencoders
    - AI agents
    - tool selection
    - feature interpretation
  # Table of contents: main manuscript + supplementary quickstart notebook
  toc:
    - file: main.md
    - file: quickstart_colab.ipynb
  # Github / code repository for the work
  github: https://github.com/dataiku/kiji-inspector
  # Bibliography file(s)
  bibliography:
    - references.bib
  # Add the abbreviations that you use in your paper here
  abbreviations:
    SAE: Sparse Autoencoder
    LLM: Large Language Model
    MoE: Mixture of Experts
    GQA: Grouped-Query Attention
    MSE: Mean Squared Error
    PCA: Principal Component Analysis
    NMI: Normalized Mutual Information
    ARI: Adjusted Rand Index
    SEM: Standard Error of the Mean
    ReLU: Rectified Linear Unit
    JumpReLU: Jump Rectified Linear Unit
    CATE: Continuous Conditional Average Treatment Effect
  # It is possible to explicitly ignore the `doi-exists` check for certain citation keys
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - Atr03
        - terradesert
        - jupyter
        - sklearn1
        - sklearn2
        # Web/blog references with no registered DOI
        - ref_gandhi2025
        - ref_bricken2023
        - elhage2022toymodelssuperposition
        - ref_sharkey2022
        - ref_bills2023
        - ref_juang2024
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
