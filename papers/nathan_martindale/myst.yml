version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2026-<folder>` the folder should be `<firstname_surname>`
  id: scipy-2026-nathan_martindale
  # Ensure your title is the same as in your `main.md`
  title:
    'Reno: Simplifying Application of Bayesian Inference to System Dynamics'
  # subtitle:
  description: Add a two sentence description about your article.
  # Authors should have affiliations, emails and ORCIDs if available
  authors:
    - name: Nathan Martindale
      email: martindalena@ornl.gov
      orcid: 0000-0002-5036-5433
      corresponding: true
      affiliations:
        - Oak Ridge National Laboratory
    - name: Jordan Stomps
      email: stompsjr@ornl.gov
      orcid: 0000-0001-7811-4479
      affiliations:
        - Oak Ridge National Laboratory
    - name: Birdy Phathanapirom
      email: birdy@ornl.gov
      orcid: 0000-0002-8992-4917
      affiliations:
        - Oak Ridge National Laboratory
  keywords:
    - System dynamics
    - Bayesian statistics
  # Add the abbreviations that you use in your paper here
  abbreviations:
    SDM: System Dynamics Modeling
  # It is possible to explicitly ignore the `doi-exists` check for certain citation keys
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - Atr03
        - terradesert
        - jupyter
        - sklearn1
        - sklearn2
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
