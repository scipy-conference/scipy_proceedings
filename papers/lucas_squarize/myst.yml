version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2026-<folder>` the folder should be `<firstname_surname>`
  id: scipy-2026-lucas_squarize
  # Ensure your title is the same as in your `main.md`
  title:
    'The Missing Lever in Machine Learning Deployment: Threshold Tuning using
    Regression Discontinuity'
  # subtitle:
  description: >
    We propose using Regression Discontinuity Design (RDD) to systematically
    optimize decision thresholds in production ML models, turning arbitrary
    cutoffs into causal, measurable, and adaptive business rules that maximize
    outcomes at scale.
  # Authors should have affiliations, emails and ORCIDs if available
  authors:
    - name: Lucas Squarize Chagas
      email: lsquarize@gmail.com
      affiliations:
        - Intuit, Inc.
    - name: Avik Basu
      email: avikbasu93@gmail.com
      orcid: 0009-0002-4489-378X
      affiliations:
        - Intuit, Inc.
        - PyOpenSci
  keywords:
    - regression discontinuity
    - threshold tuning
    - machine learning
    - causal inference
    - optimization
  # Add the abbreviations that you use in your paper here
  abbreviations:
    RDD: Regression Discontinuity Design
    ML: Machine Learning
  # It is possible to explicitly ignore the `doi-exists` check for certain citation keys
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - cattaneo2020
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
