version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2026-<folder>` the folder should be `<firstname_surname>`
  id: scipy-2026-sho_tanaka
  # Ensure your title is the same as in your `main.md`
  title: Avoiding Zero-Trade Policies in RL with a Decoupled MLOps Architecture
  # subtitle:
  description: >
    A direct Stable-Baselines3 DQN trading USD/JPY 5-minute bars completed zero
    trades on the held-out period. We describe a decoupled architecture in which
    the RL model emits a directional score and a deterministic Python execution
    engine owns position management. On the same data and split, the decoupled
    system completed 2,625 fully risk-managed trades.
  # Authors should have affiliations, emails and ORCIDs if available
  authors:
    - name: Sho Tanaka
      email: sho.tanaka@snowflake.com
      affiliations:
        - Snowflake, Tokyo
      corresponding: true
  keywords:
    - Reinforcement Learning
    - MLOps
    - FinTech
  abbreviations:
    RL: Reinforcement Learning
    MDP: Markov Decision Process
    PnL: Profit and Loss
    DQN: Deep Q-Network
    PPO: Proximal Policy Optimization
    ATR: Average True Range
    OHLC: Open, High, Low, Close
    RSI: Relative Strength Index
    MACD: Moving Average Convergence Divergence
    MLOps: Machine Learning Operations
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - stable_baselines3
        - gymnasium
        - sutton2018
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
