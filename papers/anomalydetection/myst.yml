version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2026-<folder>`
  id: scipy-2026-anomalydetection
  title:
    Detecting Anomalies in Scientific Data Using SciPy's Statistical and Signal
    Tools
  description:
    Scientific datasets often contain subtle anomalies caused by sensor faults,
    experimental drift, measurement noise, rare events, or abnormal signal
    behavior. This paper presents a SciPy-based anomaly detection workflow using
    statistical and signal-processing tools.
  # Authors should have affiliations, emails, and ORCIDs if available
  authors:
    - name: Aayush Gauba
      email: gauba.aayush@gmail.com
      orcid: 0009-0005-0521-0247
      affiliations:
        - id: SIUE
      corresponding: true
      roles:
        - Conceptualization
        - Methodology
        - Software
        - Formal analysis
        - Investigation
        - Data curation
        - Validation
        - Visualization
        - Writing – original draft
        - Writing – review & editing
  affiliations:
    - id: SIUE
      name: Southern Illinois University Edwardsville
  keywords:
    - anomaly detection
    - scipy
    - time series
    - statistical diagnostics
    - signal processing
  abbreviations:
    MAD: median absolute deviation
    EEG: electroencephalography
    UCR: University of California, Riverside
    CUSUM: cumulative sum
    LODO: leave-one-domain-out
    ROC-AUC: receiver operating characteristic area under the curve
    PR-AUC: precision-recall area under the curve
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.tex
      output: full_text.pdf
