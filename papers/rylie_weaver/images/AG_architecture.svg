  <title id="svg-title">AlphaGenome model architecture</title>
  <desc id="svg-description">A rounded convolutional encoder reduces one-base-pair DNA to 128-base-pair tokens with 1,536 channels. A rounded, flat-color transformer exchanges information with 2048-base-pair Pair Blocks through horizontal arrows: the outgoing route mean-pools by sixteen, and the return route repeats each pair axis by sixteen. A rounded decoder with the opposite color gradient restores one-base-pair resolution. Seven curved, resolution-matched skip connections join encoder and decoder stages. Solid black arrows show every tensor-flow route, including the skips, and connect the decoder, transformer, and Pair Blocks to three vertically grouped output embeddings: 1-base-pair, 128-base-pair, and pair representations. A transformer branch is projected, repeated along the sequence axis, and merged with the decoder route before the 1-base-pair embedding. The embedding group then feeds the prediction heads.</desc>
