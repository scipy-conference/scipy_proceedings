version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2026-<folder>` the folder should be `<firstname_surname>`
  id: scipy-2026-rene_lagos
  # Ensure your title is the same as in your `main.md`
  title:
    A Reproducible Data Lakehouse for High-Resolution Gastric Cancer
    Epidemiology Study in Chile
  # subtitle:
  description: Add a two sentence description about your article.
  # Authors should have affiliations, emails and ORCIDs if available
  authors:
    - name: Rene Lagos
      email: rlagos@uchile.cl
      orcid: 0000-0001-5195-9762
      affiliations:
        - Programa de Doctorado en Salud Pública, Instituto de Salud
          Poblacional, Facultad de Medicina, Universidad de Chile.
        - Centro para la Prevención y Control del Cáncer
        - Grupo de Ciencia de Datos para la Salud Pública
      corresponding: true
    - name: Cristóbal Cuadrado
      email: ccuadrado@uchile.cl
      orcid: 0000-0002-0174-5958
      affiliations:
        - Escuela de Salud Pública, Universidad de Chile
        - Centro para la Prevención y Control del Cáncer
  keywords:
    - Data Lake
    - Cancer Epidemiology
    - Health Data Pipeline
  # Add the abbreviations that you use in your paper here
  abbreviations:
    MyST: Markedly Structured Text
  # It is possible to explicitly ignore the `doi-exists` check for certain citation keys
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - Atr03
        - terradesert
        - jupyter
        - sklearn1
        - sklearn2
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
