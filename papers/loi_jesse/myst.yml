version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2026-<folder>` the folder should be `<firstname_surname>`
  id: scipy-2026-loi_jesse
  # Ensure your title is the same as in your `main.md`
  title: Bridging the Technical Gap: A Student-Led RAG Pipeline for Community-Driven Document Analysis
  # subtitle:
  description: This paper presents the impacts of using LLMs to extract and use information from PDF documents and how effective it is compared to human labeling. We present results from fuzzy matches between human and LLM labels.
  # Authors should have affiliations, emails and ORCIDs if available
  authors:
    - name: Jesse Loi
      email: jesse.loi418@gmail.com
      affiliations:
        - Seattle University

  keywords:
    - document extraction
    - LLMs
    - data labeling
  # Add the abbreviations that you use in your paper here
  abbreviations:
    MyST: Markedly Structured Text
  # It is possible to explicitly ignore the `doi-exists` check for certain citation keys
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - Atr03
        - terradesert
        - jupyter
        - sklearn1
        - sklearn2
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
