version: 1
extends: ../papers.yml
project:
  # Updated to match your exact folder name format, wrapped safely
  id: scipy-2026-loi_jesse
  # Wrapped in quotes to fix the colon syntax error
  title:
    'Bridging the Technical Gap: A Student-Led RAG Pipeline for Community-Driven
    Document Analysis'
  description:
    'This paper presents the impacts of using LLMs to extract and use
    information from PDF documents and how effective it is compared to human
    labeling. We present results from fuzzy matches between human and LLM
    labels.'
  authors:
    - name: Jesse Loi
      email: jesse.loi418@gmail.com
      affiliations:
        - Seattle University

  keywords:
    - document extraction
    - LLMs
    - data labeling
  abbreviations:
    MyST: Markedly Structured Text
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - Atr03
        - terradesert
        - jupyter
        - sklearn1
        - sklearn2
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
