      email: matt@fideus.io
      orcid: 0000-0001-9475-3756
      corresponding: true
      affiliations:
        - fideus
      roles:
        - Conceptualization
        - Methodology
        - Software
        - Writing – original draft
    - name: Johannes Soltwedel
      orcid: 0000-0003-1273-2412
      affiliations:
        - gerbi
