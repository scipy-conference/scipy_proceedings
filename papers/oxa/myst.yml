version: 1
extends: ../papers.yml
project:
  id: scipy-2026-oxa
  title: 'OXA: An Open Exchange Architecture for Modular and Composable Scientific Content'
  description: >-
    OXA is a community-driven specification that represents scientific documents
    and their components as typed, addressable JSON objects, providing an open
    exchange substrate for modular and composable research.
  authors:
    - id: rowan
      name: Rowan Cockett
      email: rowan@curvenote.com
      corresponding: true
      orcid: 0000-0002-7859-8394
      github: rowanc1
      affiliations:
        - id: csf
        - id: curvenote
    - id: tracy
      name: Tracy Teal
      email: tracy@openrxiv.org
      orcid: 0000-0002-9180-9598
      github: tracykteal
      affiliations:
        - id: openrxiv
    - id: nokome
      name: Nokome Bentley
      email: nokome@stenci.la
      orcid: 0000-0003-1608-7967
      github: nokome
      affiliations:
        - id: stencila
  affiliations:
    - id: csf
      name: Continuous Science Foundation
      ror: https://ror.org/00zwsrq61
      github: continuous-foundation
      bluesky: continuous.foundation
      linkedin: https://www.linkedin.com/company/continuous-foundation
    - id: curvenote
      name: Curvenote Inc.
      country: Canada
      ror: https://ror.org/02mz0e468
      email: support@curvenote.com
      url: https://curvenote.com
      linkedin: https://www.linkedin.com/company/curvenote/
      bluesky: curvenote.com
      github: curvenote
    - id: openrxiv
      name: openRxiv
      url: https://openrxiv.org
      ror: https://ror.org/03vc1wb14
    - id: stencila
      name: Stencila
      url: https://stenci.la
  keywords:
    - modular science
    - open standards
    - reproducibility
    - executable documents
    - scientific publishing
    - JATS
  # Abbreviations used in the paper (https://mystmd.org/guide/glossaries-and-terms#abbreviations)
  abbreviations:
    OXA: Open Exchange Architecture
    JATS: Journal Article Tag Suite
    MECA: Manuscript Exchange Common Approach
    AST: Abstract Syntax Tree
    RFC: Request for Comments
    CSF: Continuous Science Foundation
    MyST: Markedly Structured Text
    RDS: Reproducible Document Stack
    ERA: Executable Research Article
    AGU: American Geophysical Union
    ATProto: AT Protocol
  # Citation keys without a DOI are exempted from the `doi-exists` check
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - jupyter
        - jats
        - meca
        - notebooksinpublishing
        - pandoc
        - quarto
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
