version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2025-<folder>` the folder should be `<firstname_surname>`
  id: scipy-2025-allison_ding
  # Ensure your title is the same as in your `main.md`
  title: A Lightweight Pipeline for Rewards-Guided Synthetic Text Generation Using NeMo and RAPIDS
  # subtitle:
  description: "The paper introduces a lightweight pipelines for rewards-guided synthetic text generation using two NVIDIA products: NeMo and RAPIDS (i.e., cuDF, cuML)"
  # Authors should have affiliations, emails and ORCIDs if available
  bibtex: references.bib
  authors:
    - name: Allison Ding
      email: allisond@nvidia.com
      affiliations:
        - NVIDIA Corporation
      orcid: 0000-0000-0000-0000
      roles:
        - Developer Advocate, Data Science
    - name: Arham Mehta
      email: arhamm@nvidia.com
      affiliations:
        - NVIDIA Corporation
      orcid: 0000-0000-0000-0001
      roles:
        - Product Manager, NeMo
    - name: Nirmal Juluru
      email: njuluru@nvidia.com
      affiliations:
        - NVIDIA Corporation
      orcid: 0000-0000-0000-0002
      roles:
        - Product Manager, NeMo
  keywords:
    - Synthetic Data Generation
    - Reward Scoring 
    - Semantic Deduplication
    - GPU Acceleration
    - NeMo 
    - RAPIDS
    - cuML
    - cuDF
  # Add the abbreviations that you use in your paper here
  abbreviations:
    MyST: Markedly Structured Text
  # It is possible to explicitly ignore the `doi-exists` check for certain citation keys
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - nvidia2023nemo
        - rapids2023
        - sdv2020
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
