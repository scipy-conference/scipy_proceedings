version: 1
extends: ../papers.yml
project:
  id: scipy-2026-carolyn_olsen
  title:
    'Voice Capture, Structured Extraction, and Multi-Source Routing: Building
    and Evaluating a Field-Inspection Assistant in Python'
  description: |
    HiveGuide is an open-source Python application for voice-driven beekeeping
    inspection, adaptable to other field domains, that pairs typed structured
    extraction with a multi-source retrieval-augmented generation assistant,
    evaluated through a controlled comparison of seven query-routing strategies.
  authors:
    - name: Carolyn Olsen
      email: carolyn.olsen@gmail.com
      orcid: 0009-0003-7678-7030
      affiliations:
        - Independent Researcher
      corresponding: true
  keywords:
    - retrieval-augmented generation
    - multi-source RAG
    - query routing
    - structured extraction
    - scientific software
    - FastAPI
    - pgvector
    - field inspection
    - beekeeping
  abbreviations:
    RAG: Retrieval-Augmented Generation
    LLM: Large Language Model
    RAGAS: Retrieval Augmented Generation Assessment
    SQL: Structured Query Language
    API: Application Programming Interface
    TF-IDF: Term Frequency-Inverse Document Frequency
    k-NN: k-Nearest Neighbors
    USD: United States Dollar
    PDF: Portable Document Format
    JSON: JavaScript Object Notation
    HVAC: Heating, Ventilation, and Air Conditioning
    propolis: a sticky, resinous substance produced by honeybees
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - ras
        - routellm
        - hybridllm
        - ragrouter
        - selfrag
        - react
        - crag
        - autotool
        - agenticragsurvey
        - vera
        - ragsurvey
        - ragbench
        - fastapi
        - postgresql
        - pgvector
        - langchain
        - pydantic
        - lightgbm
        - sklearn
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
