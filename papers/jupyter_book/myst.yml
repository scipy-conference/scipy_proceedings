  # Add the abbreviations that you use in your paper here
  abbreviations:
    AST: Abstract Syntax Tree
    DOI: Digital Object Identifier
    MyST: Markedly Structured Text
    mystmd: MyST Document Engine
    CLI: Command Line Interface
    HTML: Hypertext Markup Language
    PDF: Portable Document Format
    RRID: Research Resource Identifier
    CSS: Cascading Style Sheet
    CRediT: Contributor Roles Taxonomy
    ROR: Research Organization Registry
    ISNI: International Standard Name Identifier
    NISO: National Information Standards Organization
    YAML: Yet Another Markup Language
    WASM: WebAssembly
    REES: Reproducible Execution Environment Specification
    URL: Uniform Resource Locator
    XML: Extensible Markup Language
    PID: Persistent Identifier
    ID: Identifier
    JATS: Journal Article Tag Suite
    VoR: Version of Record
    RST: reStructuredText
    API: Application Programming Interface
    JSON: JavaScript Object Notation
    OA: Open Access
    APC: Article Processing Charge
    JOSS: Journal of Open Source Software
    ORCID: Open Researcher and Contributor ID
    Q2F: QIIME 2 Framework
    JB1: Jupyter Book 1
    JB2: Jupyter Book 2
  # It is possible to explicitly ignore the `doi-exists` check for certain citation keys
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - Atr03
        - terradesert
        - jupyter
        - sklearn1
        - sklearn2
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
