<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Single-Agent Batch Workflow reliability harness</title>
  <desc id="desc">A generic runtime diagram showing record inputs flowing through a batch loader, worker pool, bounded hosted API gate, single tool-calling agent, cloud services, and structured outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 600 15px Arial, sans-serif; fill: #111827; }
      .small { font: 12px Arial, sans-serif; fill: #334155; }
      .tiny { font: 11px Arial, sans-serif; fill: #475569; }
      .title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .input { fill: #eff6ff; stroke: #2563eb; }
      .control { fill: #f8fafc; stroke: #64748b; }
      .agent { fill: #fff7ed; stroke: #c2410c; }
      .cloud { fill: #f1f5f9; stroke: #475569; }
      .output { fill: #ecfdf5; stroke: #059669; }
      .boundary { fill: #fafafa; stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 7 5; rx: 16; }
      .arrow { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.25; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>
  <text class="title" x="40" y="42">Single-Agent Batch Workflow</text>
  <text class="small" x="40" y="66">Reliability harness around one autonomous record-processing agent</text>

  <rect class="boundary" x="30" y="92" width="560" height="344"/>
  <text class="small" x="50" y="118">Local batch runtime</text>

  <rect class="boundary" x="625" y="92" width="285" height="344"/>
  <text class="small" x="645" y="118">Generic cloud services</text>

  <rect class="box input" x="70" y="150" width="150" height="70"/>
  <text class="label" x="113" y="180">Record</text>
  <text class="label" x="97" y="199">CSV/Excel</text>

  <rect class="box control" x="275" y="150" width="155" height="70"/>
  <text class="label" x="311" y="180">Batch</text>
  <text class="label" x="313" y="199">loader</text>
  <text class="tiny" x="292" y="216">validate and prepare</text>

  <rect class="box control" x="70" y="275" width="170" height="82"/>
  <text class="label" x="106" y="307">Worker pool</text>
  <text class="tiny" x="92" y="327">bounded process count</text>
  <text class="tiny" x="99" y="344">isolated worker state</text>

  <rect class="box control" x="300" y="275" width="190" height="82"/>
  <text class="label" x="335" y="307">Hosted API gate</text>
  <text class="tiny" x="327" y="327">semaphore-limited calls</text>
  <text class="tiny" x="334" y="344">backoff and retry policy</text>

  <rect class="box agent" x="660" y="160" width="205" height="86"/>
  <text class="label" x="704" y="193">Tool-calling</text>
  <text class="label" x="727" y="213">agent</text>
  <text class="tiny" x="694" y="232">search, extract, verify</text>

  <rect class="box cloud" x="660" y="286" width="205" height="62"/>
  <text class="label" x="708" y="313">Hosted LLM</text>
  <text class="tiny" x="721" y="332">remote model API</text>

  <rect class="box cloud" x="660" y="372" width="205" height="62"/>
  <text class="label" x="697" y="399">Managed retrieval</text>
  <text class="tiny" x="707" y="418">search over references</text>

  <rect class="box output" x="250" y="455" width="185" height="68"/>
  <text class="label" x="286" y="484">Structured</text>
  <text class="label" x="293" y="503">results</text>

  <rect class="box output" x="505" y="455" width="190" height="68"/>
  <text class="label" x="543" y="484">Checkpoints</text>
  <text class="tiny" x="538" y="503">failure log, final output</text>

  <path class="arrow" d="M220 185 H275"/>
  <path class="arrow" d="M353 220 V275"/>
  <path class="arrow" d="M240 316 H300"/>
  <path class="arrow" d="M490 316 H640"/>
  <path class="arrow" d="M762 246 V286"/>
  <path class="thin" d="M762 246 V372"/>
  <path class="arrow" d="M660 203 C590 205, 570 250, 490 292"/>
  <path class="arrow" d="M155 357 C165 430, 230 455, 300 455"/>
  <path class="arrow" d="M395 357 C410 415, 487 441, 555 455"/>

  <text class="tiny" x="513" y="294">bounded calls</text>
  <text class="tiny" x="118" y="405">per-record status</text>
  <text class="tiny" x="420" y="414">resumability</text>
</svg>
