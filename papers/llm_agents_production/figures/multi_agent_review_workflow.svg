<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Agent Review Workflow cloud interaction pattern</title>
  <desc id="desc">A generic runtime diagram showing record inputs and reference material flowing into a review harness, multiple agent components, cloud services, structured recommendations, and reviewer decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 600 15px Arial, sans-serif; fill: #111827; }
      .small { font: 12px Arial, sans-serif; fill: #334155; }
      .tiny { font: 11px Arial, sans-serif; fill: #475569; }
      .title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .input { fill: #eff6ff; stroke: #2563eb; }
      .agent { fill: #fff7ed; stroke: #c2410c; }
      .cloud { fill: #f1f5f9; stroke: #475569; }
      .review { fill: #f5f3ff; stroke: #7c3aed; }
      .output { fill: #ecfdf5; stroke: #059669; }
      .boundary { fill: #fafafa; stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 7 5; rx: 16; }
      .arrow { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.25; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>
  <text class="title" x="40" y="42">Multi-Agent Review Workflow</text>
  <text class="small" x="40" y="66">Cloud interaction pattern for assisted record review</text>

  <rect class="boundary" x="30" y="94" width="585" height="354"/>
  <text class="small" x="50" y="120">Application and review runtime</text>

  <rect class="boundary" x="645" y="94" width="270" height="354"/>
  <text class="small" x="665" y="120">Generic cloud services</text>

  <rect class="box input" x="70" y="150" width="160" height="68"/>
  <text class="label" x="117" y="179">Record</text>
  <text class="label" x="121" y="198">input</text>

  <rect class="box input" x="70" y="250" width="160" height="68"/>
  <text class="label" x="103" y="279">Reference</text>
  <text class="label" x="111" y="298">material</text>

  <rect class="box review" x="285" y="196" width="180" height="86"/>
  <text class="label" x="324" y="228">Review</text>
  <text class="label" x="327" y="247">runtime</text>
  <text class="tiny" x="323" y="266">shared execution path</text>

  <rect class="box agent" x="285" y="344" width="180" height="78"/>
  <text class="label" x="319" y="373">Agent</text>
  <text class="label" x="305" y="392">components</text>
  <text class="tiny" x="307" y="410">retrieve, reason, verify</text>

  <rect class="box cloud" x="680" y="150" width="200" height="60"/>
  <text class="label" x="718" y="177">Hosted LLM</text>
  <text class="tiny" x="727" y="196">remote model API</text>

  <rect class="box cloud" x="680" y="242" width="200" height="60"/>
  <text class="label" x="711" y="269">Managed retrieval</text>
  <text class="tiny" x="724" y="288">reference search</text>

  <rect class="box cloud" x="680" y="334" width="200" height="60"/>
  <text class="label" x="726" y="361">Persistence</text>
  <text class="tiny" x="707" y="380">decision and review state</text>

  <rect class="box output" x="505" y="190" width="100" height="232"/>
  <text class="label" x="527" y="224">Review</text>
  <text class="label" x="518" y="244">outputs</text>
  <text class="tiny" x="523" y="278">candidates</text>
  <text class="tiny" x="522" y="303">confidence</text>
  <text class="tiny" x="525" y="328">evidence</text>
  <text class="tiny" x="520" y="353">status</text>
  <text class="tiny" x="520" y="378">provenance</text>

  <rect class="box review" x="365" y="470" width="230" height="58"/>
  <text class="label" x="415" y="499">Reviewer decision</text>
  <text class="tiny" x="431" y="516">approve, correct, or reject</text>

  <path class="arrow" d="M230 184 H285"/>
  <path class="arrow" d="M230 284 C260 284, 260 239, 285 239"/>
  <path class="arrow" d="M375 282 V344"/>
  <path class="arrow" d="M465 238 H505"/>
  <path class="arrow" d="M465 383 H505"/>

  <path class="thin" d="M465 360 C545 330, 595 175, 680 180"/>
  <path class="thin" d="M465 383 C555 375, 595 275, 680 272"/>
  <path class="thin" d="M605 364 H680"/>
  <path class="thin" d="M780 210 V242"/>
  <path class="thin" d="M780 302 V334"/>

  <path class="arrow" d="M555 422 C555 447, 520 454, 500 470"/>
  <path class="arrow" d="M480 470 C442 440, 424 425, 405 422"/>

  <text class="tiny" x="537" y="175">bounded service calls</text>
  <text class="tiny" x="531" y="442">reviewable state</text>
  <text class="tiny" x="452" y="458">feedback loop</text>
</svg>
