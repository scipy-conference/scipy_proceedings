version: 1
extends: ../papers.yml
project:
  # Update this to match `scipy-2025-<folder>` the folder should be `<firstname_surname>`
  id: scipy-2025-pasteur_labs
  # Ensure your title is the same as in your `main.md`
  title: Pipeline-level differentiable programming for the real world
  # subtitle:
  description: |
    We present Tesseract, a software ecosystem that provides pipeline-level automatic differentiation
    and differentiable physics programming at scale, and demonstrate its utility on a parametric shape 
    optimization problem.
  # Authors should have affiliations, emails and ORCIDs if available
  authors:
    - name: The Pasteur Labs Team
      email: hello@simulation.science
      orcid: 0000-0000-0000-0000
      affiliations:
        - Pasteur Labs
  keywords:
    - automatic differentiation
    - differentiable programming
    - differentiable physics
    - remote procedure calls
    - distributed computing
    - computer-aided engineering
    - containerization
    - scientific computing
    - scientific machine learning
    - simulation
    - interoperability
  banner: banner.png
  thumbnail: thumbnail.png
  # Add the abbreviations that you use in your paper here
  abbreviations:
    AD: Automatic Differentiation
    DPP: Differentiable Physics Programming
    CAE: Computer-aided Engineering
    API: Application Programming Interface
    CFD: Computational Fluid Dynamics
    FEM: Finite Element Method
  # It is possible to explicitly ignore the `doi-exists` check for certain citation keys
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - Triton_Inference_Server
        - BentoML
        - MLServer
        - baydin2018automatic
        - abadi2016tensorflow
        - paszke2017automatic
        - jax2018github
        - baker2021peering
        - rush2024federated
        - tang2023auto
        - van2018automatic
  exports:
    - id: pdf
      format: typst
      template: https://github.com/curvenote-templates/scipy.git
      article: main.md
      output: full_text.pdf
